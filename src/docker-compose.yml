version: '3.8'

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: adrs-postgres
    environment:
      POSTGRES_DB: adrs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adrs-network

  # ADRS API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adrs-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adrs
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/postgres
    volumes:
      # Mount data directory to persist uploaded campaigns
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - adrs-network
    restart: unless-stopped

  # Database initialization service (runs once)
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adrs-db-init
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adrs
      POSTGRES_URL: postgresql://postgres:postgres@postgres:5432/postgres
    command: python create_tables.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - adrs-network
    restart: "no"

volumes:
  postgres_data:
    driver: local

networks:
  adrs-network:
    driver: bridge
